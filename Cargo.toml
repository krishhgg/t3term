[package]
name = "t3term"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
textwrap = "0.16.4"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-std", "io-util"] }
tokio-tungstenite = "0.28"
unicode-width = "0.2.2"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
