# Checks every pull request and every push to master. It needs no secrets and never reaches a
# real T3 server: the tests use fake servers on 127.0.0.1 and temporary home directories.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request replaces its running check. Every push to master finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the toolchain t3term is developed with, so a new Rust release cannot add a clippy
  # lint that fails an unrelated pull request. Bump it on purpose, in its own pull request.
  RUST_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-26
          # Linux is not supported yet. This only shows the code builds and the tests pass there.
          - name: Linux build (unsupported)
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      # Pull requests only read the cache. Pushes to master write it, once per Cargo.lock.
      - name: Restore cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # Builds the way README.md says to, then runs the binary with an empty home. With no
      # server to find, doctor must fail cleanly: exit 5 and one JSON object on stdout.
      - name: Release build smoke test
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release
          ./target/release/t3term --version
          home="$(mktemp -d)"
          status=0
          env -i PATH="$PATH" HOME="$home" T3CODE_HOME="$home/.t3" \
            ./target/release/t3term --json doctor > doctor.json || status=$?
          cat doctor.json
          test "$status" -eq 5
          jq -e '.ok == false and .checks.server.ok == false' doctor.json > /dev/null

      - name: Save cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
